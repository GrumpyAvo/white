services:
  - type: web
    name: white
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    healthCheckPath: /
    envVars:
      - key: ADMIN_PASSWORD
        value: admin123
      - key: SECRET_KEY
        generateValue: true
      # Spotify now-playing + top-stats. Set the real values in the Render
      # dashboard (from https://developer.spotify.com/dashboard) — without them
      # the widget stays "not playing" and top-stats are empty.
      - key: SPOTIFY_CLIENT_ID
        value: your-spotify-client-id
      - key: SPOTIFY_CLIENT_SECRET
        value: your-spotify-client-secret
      - key: SPOTIFY_REFRESH_TOKEN
        value: your-spotify-refresh-token
      # Durable storage: without these, admin content resets to seed data on
      # every redeploy. Set the real values in the Render dashboard from the
      # Supabase project settings (Project URL + service_role key).
      - key: SUPABASE_URL
        value: https://your-project-ref.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: your-service-role-key
