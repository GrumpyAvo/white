{% extends "admin/base.html" %}
{% block title %}settings · white{% endblock %}
{% block content %}
<div class="page active">
  <div class="page-header">
    <div class="page-title">Site Settings</div>
    <div class="page-sub">used by the header marquee, footer tagline, and guestbook status</div>
  </div>
  <form method="post" action="{{ url_for('admin.settings_admin') }}" style="max-width:600px">
    {% for key, label in fields %}
    <div class="editor-field">
      <label>{{ label }}</label>
      {% if key == 'guestbook_open' %}
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 0;">
          <input type="checkbox" name="{{ key }}" {% if (current.get(key) or 'true') != 'false' %}checked{% endif %} /> Guestbook open for new messages
        </label>
      {% else %}
        <input type="text" name="{{ key }}" value="{{ current.get(key) or '' }}" />
      {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="save-btn">💾 Save Settings</button>
  </form>
</div>
{% endblock %}
